baseURL: "https://binary.builders"
languageCode: en-us
title: Binary Builders
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

theme: BinaryBuilders

build:
  writeStats: true
  noJSConfigInAssets: true

imaging:
  quality: 82
  resampleFilter: Lanczos
  anchor: Smart
  exif:
    disableDate: true
    disableLatLong: true
  format: "webp"
  bgColor: "#ffffff"
  hint: photo

minify:
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false
    css:
      keepCSS2: false
    js:
      keepVarNames: false

taxonomies:
  category: categories
  tag: tags

markup:
  highlight:
    noClasses: false
    lineNos: true
  goldmark:
    renderer:
      unsafe: true

params:
  description: "Binary Builders - Building at the frontier of crypto."
  author: "Binary Builders"
  images: ["images/og-default.jpg"]
  contact:
    email: "contact@binary.builders"

  # Social Media
  social:
    twitter: "binary_builders"
    github: "01builders"
    linkedin: "company/binary-builders"

  # SEO
  defaultKeywords: ["crypto", "blockchain", "binary builders", "web3", "building"]

  # Analytics
  googleAnalytics: ""

  # Features
  features:
    search: true
    newsletter: true
